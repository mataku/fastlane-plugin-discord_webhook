AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false

Bundler/DuplicatedGem:
  Enabled: true

Bundler/DuplicatedGroup:
  Enabled: true

Bundler/GemFilename:
  Enabled: true

Bundler/InsecureProtocolSource:
  Enabled: true

Gemspec/AttributeAssignment:
